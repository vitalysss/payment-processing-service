x-app-service: &app-service
  build: .
  image: payment-processing-service:local
  environment: &app-environment
    API_KEY: ${API_KEY:-dev-api-key}
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['API_KEY']}); urllib.request.urlopen(request)"]
      interval: 5s
      timeout: 3s
      retries: 20

  consumer:
    <<: *app-service
    command: ["faststream", "run", "app.consumer:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  webhook-sink:
    <<: *app-service
    command: ["uvicorn", "app.webhook_sink:app", "--host", "0.0.0.0", "--port", "9000"]
    profiles: ["test"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
