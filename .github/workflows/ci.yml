name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: docker compose config --quiet
      - run: docker build -t payment-processing-service:test .

  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: docker compose --profile test up -d --build
      - run: python scripts/smoke_test.py
      - if: always()
        run: docker compose --profile test logs --no-color
      - if: always()
        run: docker compose --profile test down -v
